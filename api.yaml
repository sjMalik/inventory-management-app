openapi: 3.0.0
info:
  title: Inventory Management API
  description: API documentation for user authentication (Register & Login)
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /auth/register:
    post:
      summary: User Registration
      description: Register a new user by providing email, password, and other details.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - first_name
                - last_name
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: StrongPassword123!
                first_name:
                  type: string
                  example: John
                last_name:
                  type: string
                  example: Doe
                role:
                  type: string
                  enum: [ADMIN, PURCHASING_MANAGER, SUPPLIER, SALES_MANAGER, CUSTOMER, OTHERS]
                  example: CUSTOMER
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User registered successfully"
        "400":
          description: Bad Request (Invalid input or email already exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "User already exists"

  /auth/login:
    post:
      summary: User Login
      description: Authenticate user and return a JWT token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: StrongPassword123!
      responses:
        "200":
          description: Successful login, returns JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login successful"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "401":
          description: Unauthorized (Invalid email or password)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid credentials"

  /products:
    get:
      summary: Get all products with pagination, filtering, and search
      tags:
        - Products
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of products retrieved successfully
          content:
            application/json:
              schema:
                type: object
        "500":
          description: Internal server error

    post:
      summary: Create a new product (Admin & Purchasing Manager only)
      tags:
        - Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Smartphone"
                description:
                  type: string
                  example: "Latest model with high battery backup"
                price:
                  type: number
                  format: float
                  example: 799.99
                stock_quantity:
                  type: integer
                  example: 50
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  example: "ACTIVE"
      responses:
        "201":
          description: Product created successfully
        "500":
          description: Internal server error